<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChildDiary Export | Download</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <svg viewBox="0 0 100 100" width="40" height="40">
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6F2F20"/>
                            <stop offset="11%" stop-color="#7E3525"/>
                            <stop offset="22%" stop-color="#8B3A2B"/>
                            <stop offset="33%" stop-color="#9E5020"/>
                            <stop offset="44%" stop-color="#A65E2B"/>
                            <stop offset="55%" stop-color="#B85C3E"/>
                            <stop offset="66%" stop-color="#C47F47"/>
                            <stop offset="77%" stop-color="#D88032"/>
                            <stop offset="88%" stop-color="#E8A872"/>
                            <stop offset="100%" stop-color="#F5E6D3"/>
                        </linearGradient>
                    </defs>
                    <path d="M25 25 L25 75 L75 75 L75 40 L50 40 L50 25 Z" fill="url(#grad)" stroke="#8B3A2B" stroke-width="2"/>
                    <path d="M50 25 L50 40 L75 40" fill="none" stroke="#8B3A2B" stroke-width="2"/>
                    <rect x="30" y="30" width="40" height="5" fill="#F5D5B0"/>
                </svg>
                <h1>ChildDiary Export</h1>
            </div>
            <nav>
                <button class="lang-btn active" data-lang="en">English</button>
                <button class="lang-btn" data-lang="pt">Português</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <p class="tagline" data-en="Export your ChildDiary photos easily" data-pt="Exporte as suas fotos do ChildDiary facilmente"></p>
        </section>

        <section class="description" data-en="A simple tool to download and save all your photos from ChildDiary app." data-pt="Uma ferramenta simples para transferir e guardar todas as suas fotos do aplicativo ChildDiary."></section>

        <section class="releases">
            <h2 data-en="Latest Releases" data-pt="Últimas Versões"></h2>
            <div id="releases-list" class="releases-list">
                <div class="loading" data-en="Loading releases..." data-pt="A carregar versões..."></div>
            </div>
        </section>

        <section class="instructions">
            <h2 data-en="How to Use" data-pt="Como Usar"></h2>
            <ol>
                <li data-en="Download the executable for your platform" data-pt="Transfira o executável para a sua plataforma"></li>
                <li data-en="Run the application" data-pt="Execute a aplicação"></li>
                <li data-en="Enter your ChildDiary credentials when prompted" data-pt="Introduza as suas credenciais do ChildDiary quando solicitado"></li>
                <li data-en="Select output directory and options" data-pt="Seleccione a pasta de destino e opções"></li>
                <li data-en="Start the export!" data-pt="Inicie a exportação!"></li>
            </ol>
        </section>

        <section class="features">
            <h2 data-en="Features" data-pt="Funcionalidades"></h2>
            <ul>
                <li data-en="Export all media from ChildDiary" data-pt="Exportar todos os media do ChildDiary"></li>
                <li data-en="Optional compression (zip, gzip, bz2)" data-pt="Compressão opcional (zip, gzip, bz2)"></li>
                <li data-en="Resume from specific page" data-pt="Retomar de uma página específica"></li>
                <li data-en="Secure credential storage via keyring" data-pt="Armazenamento seguro de credenciais via keyring"></li>
            </ul>
        </section>
    </main>

    <footer>
        <div class="container">
            <p data-en="Open source on GitHub" data-pt="Código aberto no GitHub"></p>
            <p><a href="https://github.com/SamuelNLP/child-diary-photo-export">SamuelNLP/child-diary-photo-export</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
