[project]
name = "photo-export"
version = "0.0.0"
description = "Tool to export photos from the child diary app."
authors = [{ name = "Samuel Pedro" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-dotenv",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
